name: Correctness Regression

on:
  push:
    branches: [main, codex/upstream-correctness]
  pull_request:

jobs:
  regression:
    name: Java 11 correctness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install Ant on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ant --no-progress -y
      - name: Install Ant on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ant
      - name: Run isolated correctness regressions
        run: ant clean test-regression
